# docker-compose.yml: Hi4Lines Optuna + Postgres + Dashboard + Train GPU
version: '3.8'

services:
  # 1) Postgres for Optuna RDBStorage
  postgres:
    image: postgres:14                     # Official Postgres image
    ports:
      - "5432:5432"
    container_name: optuna-postgres        # Easy reference by name
    restart: always
    environment:
      POSTGRES_USER: optuna_user           # Credentials match your scripts
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: optuna_db
    volumes:
      - pgdata:/var/lib/postgresql/data    # Persist DB files across restarts
    networks:
      - ml-net

  # 2) Optuna Dashboard for live monitoring
  dashboard:
    image: ghcr.io/optuna/optuna-dashboard:latest
    container_name: optuna-dashboard
    depends_on:
      - postgres                            # Wait for Postgres to start
    ports:
      - '8080:8080'                         # Expose dashboard at localhost:8080
    entrypoint:                             # Ensure the correct binary is called
      - "optuna-dashboard"
    command: [
      "postgresql+psycopg2://optuna_user:secretpass@optuna-postgres:5432/optuna_db",
      "--host", "0.0.0.0",
      "--port", "8080"
    ]
    networks:
      - ml-net

  # 3) Training service (one trial only)
  train:
    build:
      context: .                            # Build from repo root
      dockerfile: Dockerfile               # Your GPU-enabled Dockerfile
    image: hi4lines-gpu:latest            # Tag for pulling/running
    container_name: hi4lines-gpu
    volumes:
      - .:/app                             # Mount code & configs
#    gpus: all
#    device_requests:
#      - driver: nvidia
#        count: -1          # -1 means “all” GPUs
#        capabilities: [gpu]
    working_dir: /app                      # Ensure script runs from /app
    ipc: host                              # Share host IPC (for datasets/large models)
    # Note: to enable GPUs, run with `--gpus all`:
    # docker-compose run --rm --gpus all train python3 scripts/fmfp_opt.py
    networks:
      - ml-net
    entrypoint:
      - "bash"
      - "-lc"
    command:
      - "pip install -e . && cd scripts && python3 scripts.fmfp_opt.py"
  # 4) TensorBoard for viewing training logs
  tensorboard:
    image: tensorflow/tensorflow:latest    # Includes TensorBoard binary
    restart: always                        # Keep accessible
    ports:
      - '6007:6006'                         # Expose TensorBoard UI
    volumes:
      - ./models/:/app/logs                    # Local logs directory
    command:
      - tensorboard
      - --logdir=/app/logs/coral_25_06_v2/ #orca_14_06_v2/
      - --host=0.0.0.0
      - --port=6006
    networks:
      - ml-net

    # 5) DeGirum Compiler API service (runs a specific Python script on start)
  compiler_api:
    image: degirum/dg_compiler_api:latest
    container_name: dg_compiler_api
    restart: always
    volumes:
      - ./models/:/output_files                    # Local logs directory
    ports:
      - '8535:8535'
      - '8778:8778'
    networks:
      - ml-net

  hailo:
    # 1) The imported suite image
    image: dockeruser1232/apel-edgeaionplatforms:hailo_ai_sw_suite_2025-04
    #hailo_ai_sw_suite_2025-04:1
    container_name: hailo_ai_sw_suite_2025-04_container_custom

    entrypoint: ["bash", "-l"]
    stdin_open: true   # -i
    tty: true          # -t

    # 2) Privileges & networking just like your script had
    privileged: true
    network_mode: host
    ipc: host
    group_add:
      - 44

    # 3) GPU support (if enabled in your .env)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ALL
              capabilities: [gpu]

    # 4) Environment variables your suite needs
    environment:
      DISPLAY: "${DISPLAY}"
      XDG_RUNTIME_DIR: "${XDG_RUNTIME_DIR}"
      HAILORT_ENABLE_SERVICE: "${HAILORT_ENABLE_SERVICE:-no}"
      SERVICE_ENABLE_MONITOR: "${SERVICE_ENABLE_MONITOR:-no}"
      HAILORT_LOGGER_PATH: "${HAILORT_LOGGER_PATH:-/var/log/hailo}"

    # 5) All those host‐>container mounts
    volumes:
      - type: volume
        source: hailo_data
        target: /home/amax/HI4Lines_Insp
        # rw by default
      - "/tmp/hailo_docker.xauth:/home/hailo/.Xauthority"
      - "/tmp/.X11-unix:/tmp/.X11-unix"
      - "/dev:/dev"
      - "/lib/firmware:/lib/firmware"
      - "/lib/modules:/lib/modules"
      - "/lib/udev/rules.d:/lib/udev/rules.d"
      - "/usr/src:/usr/src"
      - "/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket"
      - "/etc/machine-id:/etc/machine-id:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
      # optional host DKMS directory (if you need kernel modules rebuilt):
      - type: bind
        source: /var/lib/dkms
        target: /var/lib/dkms

    # 6) Always restart unless explicitly stopped
    restart: unless-stopped
  stm32ai:
    build:
      context: .
      dockerfile: Dockerfile.stm32    # ← your actual Dockerfile name here
      target: runtime
    ports:
      - "5000:5000"
    volumes:
      - stm32-data:/data
  fake_rpi:
    build:
      context: .
      dockerfile: Dockerfile.fake_rpi
      target: builder
    # flask requires SIGINT to stop gracefully
    # (default stop signal from Compose is SIGTERM)
    stop_signal: SIGINT
    ports:
      - '8004:8004'
  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minio99
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_vol:/data
    command: server /data --console-address ":9001"
volumes:
  minio_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      # either an absolute path:
      device: ./minio_data

  pgdata:                                  # Named volume for Postgres data
    driver: local
    driver_opts:
      type: none
      o: bind
      # either an absolute path:
      device: ./pgdata
  hailo_data:
    driver: local
  stm32-data:

networks:
  ml-net:                                  # User-defined bridge network
    driver: bridge
